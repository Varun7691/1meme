<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7gag - Login</title>
</head>
<script type="module" src="js/index.js"></script>
<!-- <link rel="stylesheet" href="css/9one.css" /> -->

<style media="screen">
    * {
        font-family: Verdana, sans-serif;
    }

    h1 {
        text-align: center;
    }

    h3 {
        text-align: center;
    }

    form {
        height: 620px;
        width: 406px;
        background-color: rgba(255, 255, 255, 0.13);
        position: absolute;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        border-radius: 10px;
        /* backdrop-filter: blur(10px); */
        border: 2px solid grey;
        /* box-shadow: 0 0 10px rgba(8, 7, 16, 0.6); */
        padding: 50px 35px;
    }

    form h3 {
        font-size: 32px;
        font-weight: 500;
        line-height: 42px;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 30px;
        font-size: 16px;
        font-weight: 500;
    }

    input {
        display: block;
        height: 50px;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.07);
        border-radius: 3px;
        padding: 0 10px;
        margin-top: 8px;
        font-size: 14px;
        font-weight: 300;
    }

    ::placeholder {
        color: grey;
    }

    button {
        margin-top: 10px;
        width: 100%;
        background-color: #ffffff;
        color: #080710;
        padding: 15px 0;
        font-size: 18px;
        font-weight: 600;
        border-radius: 5px;
        cursor: pointer;
    }
</style>

<body>
    <h1>7gag
    </h1>

    <form id="login-form">
        <h3>Login
        </h3>
        <label for="email"><b>Email: </b></label>
        <input type="text" placeholder="Enter Email" name="email" id="email" required>
        <label for="password"><b>Password: </b></label>
        <input type="password" placeholder="Enter Password" name="password" id="password" required>
        <br />
        <br />
        <button type="submit">Login</button>
        <span class="psw"><a href="#"></a>Forgot password?</a></span>
        <br />
        <br />
        <button type="button" class="cancelbtn" id="signup-button">SignUp</button>
        <br />
        <br />
        <button type="button" class="cancelbtn" id="guest-button">Just Visiting</button>
    </form>
</body>
