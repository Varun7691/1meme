<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>7gag - Login</title>
</head>
<script type="module" src="js/index.js"></script>
<link rel="stylesheet" href="css/9one.css" />

<body>
    <h1>7gag
    </h1>

    <h3>Login
    </h3>

    <form id="login-form">
        <div class="container">
            <label for="email"><b>Email: </b></label>
            <input type="text" placeholder="Enter Email" name="email" id="email" required>
            <br />
            <br />
            <label for="password"><b>Password: </b></label>
            <input type="password" placeholder="Enter Password" name="password" id="password" required>
            <br />
            <br />
            <button type="submit">Login</button>
            <button type="button" class="cancelbtn">Cancel</button>
        </div>

        <span class="psw"><a href="#"></a>Forgot password?</a></span>
        <br />
        <br />
        <button type="button" class="cancelbtn" id="signup-button">SignUp</button>
        <br />
        <br />
        <button type="button" class="cancelbtn" id="guest-button">Just Visiting</button>
    </form>
</body>
