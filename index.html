<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7gag - Login</title>
</head>
<script type="module" src="js/index.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />

<style>
    :root {
        --accent-color: #FFD740;
        --primary-color: #080710;
        --secondary-color: #fff;
        --grey: #797979;
    }

    *,
    *:before,
    *:after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    h1 {
        display: block;
        text-align: center;
        margin-top: 40px;
        font-size: 40px;
        font-weight: 600;
    }

    .login-form {
        height: 550px;
        width: 500px;
        position: absolute;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        backdrop-filter: blur(10px);
        border-color: var(--grey);
        border-style: solid;
        border-width: 1px;
        padding: 20px 35px;
    }

    .login-form * {
        font-family: 'Poppins', sans-serif;
        letter-spacing: 0.5px;
    }

    .login-form h3 {
        font-size: 28px;
        font-weight: 500;
        line-height: 42px;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 20px;
        font-size: 16px;
        font-weight: 500;
    }

    input {
        display: block;
        height: 50px;
        width: 100%;
        color: var(--primary-color);
        border-style: solid;
        border-width: 1px;
        border-color: var(--grey);
        padding: 0 10px;
        margin-top: 8px;
        font-size: 14px;
        font-weight: 300;
    }

    ::placeholder {
        color: var(--grey);
    }

    button {
        margin-top: 30px;
        width: 100%;
        background-color: var(--secondary-color);
        border: 2px solid var(--primary-color);
        color: var(--primary-color);
        padding: 10px 0;
        font-size: 18px;
        font-weight: 400;
        cursor: pointer;
    }

    button:hover {
        background-color: var(--primary-color);
        color: var(--secondary-color);
    }

    .forgot-password-signup {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
    }

    .forgot-password {
        margin: 0;
    }

    .signup {
        margin: 0;
    }

    .signup:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    .forgot-password:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 1;
        padding-top: 100px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
        background-color: var(--secondary-color);
        margin: auto;
        padding: 20px;
        border: 1px solid var(--grey);
        width: 550px;
    }

    .close {
        color: var(--grey);
        float: right;
        font-size: 28px;
        font-weight: bold;
        font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
    }

    .close:hover,
    .close:focus {
        color: var(--primary-color);
        text-decoration: none;
        cursor: pointer;
    }

    .reset-password {
        margin-top: 20px;
    }

    .version-label {
        font-size: 12px;
        font-weight: 100;
        color: var(--grey);
        text-align: center;
    }
</style>

<body>
    <h1>7gag
    </h1>
    <form id="login-form" class="login-form">
        <h3>Login
        </h3>
        <label for="email"><b>Email: </b></label>
        <input type="text" placeholder="Enter Email" name="email" id="email" required>
        <label for="password"><b>Password: </b></label>
        <input type="password" placeholder="Enter Password" name="password" id="password" required>
        <button type="submit">Login</button>

        <div class="forgot-password-signup">
            <label id="forgot-password-btn" class="forgot-password">Forgot password?</label>
            <label type="button" class="signup" id="signup-button">SignUp</label>
        </div>

        <button type="button" class="cancelbtn" id="guest-button">Just Visiting</button>

        <label class="version-label">Version - 1.0.0</label>
    </form>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close material-symbols-outlined">close</span>
            <p>Forgot Password</p>
            <form id="forgot-password-form">
                <label for="email"><b>Email: </b></label>
                <input type="text" placeholder="Enter email to send the reset password link" name="email"
                    id="forgot-password-email" required>
                <button type="submit" class="reset-password" id="reset-password-button">Reset</button>
            </form>
        </div>
    </div>
</body>
