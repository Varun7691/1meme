<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7gag - Login</title>
</head>
<script type="module" src="js/index.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
    *,
    *:before,
    *:after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    h1 {
        display: block;
        text-align: center;
        margin-top: 40px;
        font-size: 40px;
        font-weight: 600;
    }

    form {
        height: 550px;
        width: 400px;
        position: absolute;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        backdrop-filter: blur(10px);
        border-color: grey;
        border-style: solid;
        border-width: 1px;
        padding: 20px 35px;
    }

    form * {
        font-family: 'Poppins', sans-serif;
        letter-spacing: 0.5px;
    }

    form h3 {
        font-size: 28px;
        font-weight: 500;
        line-height: 42px;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 20px;
        font-size: 16px;
        font-weight: 500;
    }

    input {
        display: block;
        height: 50px;
        width: 100%;
        color: black;
        border-style: solid;
        border-width: 1px;
        border-color: grey;
        padding: 0 10px;
        margin-top: 8px;
        font-size: 14px;
        font-weight: 300;
    }

    ::placeholder {
        color: #797979;
    }

    button {
        margin-top: 30px;
        width: 100%;
        background-color: #ffffff;
        border: 2px solid black;
        color: #080710;
        padding: 15px 0;
        font-size: 18px;
        font-weight: 400;
        cursor: pointer;
    }

    button:hover {
        background-color: #080710;
        color: #ffffff;
    }

    .forgot-password-signup {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
    }

    .forgot-password {
        margin: 0;
    }

    .signup {
        margin: 0;
    }

    .signup:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    .forgot-password:hover {
        text-decoration: underline;
        cursor: pointer;
    }
</style>

<body>
    <h1>7gag
    </h1>
    <form id="login-form">
        <h3>Login
        </h3>
        <label for="email"><b>Email: </b></label>
        <input type="text" placeholder="Enter Email" name="email" id="email" required>
        <label for="password"><b>Password: </b></label>
        <input type="password" placeholder="Enter Password" name="password" id="password" required>
        <button type="submit">Login</button>

        <div class="forgot-password-signup">
            <label class="forgot-password">Forgot password?</label>
            <label type="button" class="signup" id="signup-button">SignUp</label>
        </div>

        <button type="button" class="cancelbtn" id="guest-button">Just Visiting</button>
    </form>

</body>
