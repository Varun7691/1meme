<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7gag</title>
    <script src="https://kit.fontawesome.com/0af1729e03.js" crossorigin="anonymous"></script>
</head>
<script type="module" src="js/home_new.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
    *,
    *:before,
    *:after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body{
        padding-bottom: 20px;
    }

    ul {
        text-align: center;
        list-style-type: none;
    }

    .post-item {
        border-style: solid;
        border-width: 1px;
        border-color: #080710;
        width: 600px;
        margin-left: auto;
        margin-right: auto;
        margin-top: 10px;
        margin-bottom: 10px;
        font-family: 'Poppins', sans-serif;
        padding: 20px;
    }

    .post-title-container {
        text-align: left;
    }

    .post-title {
        font-size: 20px;
        font-weight: 600;
    }

    .post-item>img {
        width: 550px;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    .vote-container {
        display: flex;
        justify-content: space-between;
    }

    .post-user-container {
        text-align: left;
    }

    .post-user {
        font-size: 14px;
        font-weight: 100;
        color: #797979;
        margin-bottom: 10px;
    }

    .selected {
        color: #448AFF;
        font-weight: 300;
        padding: 0 10px;
        font-size: 14px;
    }

    .post-up-btn {
        font-weight: 300;
        padding: 0 10px;
        font-size: 14px;
        color: #080710;
    }

    .post-down-btn {
        font-weight: 300;
        padding: 0 10px;
        font-size: 14px;
        color: #080710;
    }

    .unselected {
        color: #080710;
        font-weight: 300;
        padding: 0 10px;
        font-size: 14px;
    }

    .selected:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    .unselected:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    .header-container {
        width: 700px;
        margin-left: auto;
        margin-right: auto;
        margin-top: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: 'Poppins', sans-serif;
    }

    button {
        width: 100%;
        background-color: #ffffff;
        border: 2px solid black;
        color: #080710;
        padding: 10px 0;
        font-size: 18px;
        font-weight: 300;
        cursor: pointer;
        margin: 10px 20px;
    }

    #home-profile {
        font-size: 18px;
        color: #080710;
        padding: 0 10px;
    }

    #home-profile:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    #home-sign-out {
        font-size: 18px;
        color: #080710;
        padding: 0 10px;
    }

    #home-sign-out:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    .vote-date-container {
        display: flex;
        justify-content: space-between;
    }

    .post-age {
        font-weight: 300;
        padding: 0 10px;
        font-size: 14px;
    }

    .pagination-container {
        position: relative;
        width: 500px;
        height: 50px;
        margin-left: auto;
        margin-right: auto;
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #btn_prev:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    #btn_next:hover {
        text-decoration: underline;
        cursor: pointer;
    }

    #btn_prev,
    #btn_next {
        width: auto;
        position: absolute;
        top: 30%;
        transform: translateY(-50%);
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        background-color: #fff;
        border: 2px solid #080710;
        color: #080710;
    }

    #btn_prev:hover,
    #btn_next:hover {
        background-color: #080710;
        color: #ffffff;
    }


    #btn_prev {
        left: 0;
        display: none;
    }

    #btn_next {
        right: 0;
        display: none;
    }
</style>

<body>
    <div class="header-container">
        <div>
            <h1>7gag - Test</h1>
        </div>
        <div class="header-buttons-container">
            <label id='home-profile'>Profile</label>
            <label id='home-sign-out'>Sign Out</label>
        </div>
    </div>
    <label id="all-post-loading">Loading...</label>
    <ul id="all-posts-list"></ul>
    <div class="pagination-container">
        <button id="btn_prev"><i class="fa-solid fa-left-long"></i></button>
        <button id="btn_next"><i class="fa-solid fa-right-long"></i></button>
    </div>
</body>

</html>
