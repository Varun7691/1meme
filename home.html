    // Firestore


    var listHtml = "";
    const firestore = getFirestore(app, "nineone");

    const allPostsQuery = query(collection(firestore, "posts"));
    const allPostsQueryQuerySnapshot = await getDocs(allPostsQuery);
    allPostsQueryQuerySnapshot.forEach((_post) => {
        const post = _post.data();

        listHtml += `<li><h2>${post.post_title}</h2><br/><img src="${post.post_image_path}"id='user-display-picture' width="10%" height="10%"/><br/>${post.up_count} Ups - ${post.down_count} Downs</li>`;

        document.getElementById("all-posts-list").innerHTML = listHtml;
    });

    document.getElementById('profile-sign-out').addEventListener('click', function () {
